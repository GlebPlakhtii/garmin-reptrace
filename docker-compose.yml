# Garmin RepTrace. Web + storage by default; Garmin and Telegram are opt-in.

services:
  garmin-fetch-data:
    profiles: [garmin]
    command: ["uv", "run", "--no-sync", "garmin-reptrace-sync"]
    restart: unless-stopped
    image: garmin-reptrace:local
    build: .
    depends_on:
      - influxdb
    volumes:
      - ./garminconnect-tokens:/home/appuser/.garminconnect
    environment:
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
      - INFLUXDB_USERNAME=influxdb_user
      - INFLUXDB_PASSWORD=influxdb_secret_password
      - INFLUXDB_DATABASE=GarminStats
      - USER_TIMEZONE=${USER_TIMEZONE:-UTC}
      - GARMINCONNECT_IS_CN=${GARMINCONNECT_IS_CN:-False}

  strength-web:
    image: garmin-reptrace:local
    build: .
    restart: unless-stopped
    command: ["uv", "run", "--no-sync", "garmin-reptrace"]
    volumes:
      - strength_web_data:/var/lib/form
      - ./garminconnect-tokens:/home/appuser/.garminconnect:ro
    depends_on:
      - influxdb
    ports:
      - '${WEB_BIND_IP:-127.0.0.1}:3001:3001'
    environment:
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
      - INFLUXDB_USERNAME=influxdb_user
      - INFLUXDB_PASSWORD=influxdb_secret_password
      - INFLUXDB_DATABASE=GarminStats
      - USER_TIMEZONE=${USER_TIMEZONE:-UTC}
      - WEB_PORT=3001
      - WEB_HOST=0.0.0.0
      - WEB_ALLOWED_HOSTS=${WEB_ALLOWED_HOSTS:-}
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/api/health', timeout=20).read()"]
      interval: 30s
      timeout: 25s
      retries: 3
      start_period: 15s

  telegram-bot:
    profiles: [telegram]
    image: garmin-reptrace:local
    build: .
    restart: unless-stopped
    command: ["uv", "run", "--no-sync", "garmin-reptrace-telegram"]
    depends_on:
      strength-web:
        condition: service_healthy
    volumes:
      - telegram_bot_data:/var/lib/form-bot
    environment:
      - FORM_API_URL=http://strength-web:3001
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_USER_ID=${TELEGRAM_ALLOWED_USER_ID:-}
      - TELEGRAM_PAIRING_CODE=${TELEGRAM_PAIRING_CODE:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-6-sol}
      - OPENAI_REASONING_EFFORT=${OPENAI_REASONING_EFFORT:-medium}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-6-sol}
      - OPENAI_CHAT_REASONING_EFFORT=${OPENAI_CHAT_REASONING_EFFORT:-low}
      - OPENAI_FOOD_MODEL=${OPENAI_FOOD_MODEL:-gpt-6-sol}
      - FOOD_HAND_LENGTH_CM=${FOOD_HAND_LENGTH_CM:-}
      - MONTHLY_REPORT_ENABLED=${MONTHLY_REPORT_ENABLED:-true}
      - REPORT_TIMEZONE=${REPORT_TIMEZONE:-UTC}
      - WEEKLY_REPORT_ENABLED=${WEEKLY_REPORT_ENABLED:-true}
      - WEEKLY_REPORT_TIME=${WEEKLY_REPORT_TIME:-09:00}
      - POST_WORKOUT_REPORT_ENABLED=${POST_WORKOUT_REPORT_ENABLED:-true}
      - REPORT_SETTLE_SECONDS=${REPORT_SETTLE_SECONDS:-300}

  influxdb:
    restart: unless-stopped
    hostname: influxdb
    environment:
      - INFLUXDB_DB=GarminStats
      - INFLUXDB_USER=influxdb_user
      - INFLUXDB_USER_PASSWORD=influxdb_secret_password
      - INFLUXDB_DATA_INDEX_VERSION=tsi1
    expose:
      - '8086'
    volumes:
      - influxdb_data:/var/lib/influxdb
    image: 'influxdb:1.11'

volumes:
  telegram_bot_data:
  strength_web_data:
  influxdb_data:
