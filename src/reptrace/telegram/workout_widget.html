<!doctype html>
<html lang="en"><head><style>
body{font-family:system-ui,sans-serif;font-size:14px;line-height:1.3;color:var(--tg-theme-text-color);margin:12px}
h2{font-size:18px;line-height:1.2;margin:4px 0;max-height:44px;overflow:hidden;overflow-wrap:anywhere}
p{margin:5px 0}.muted{color:var(--tg-theme-hint-color);font-size:12px}
.metrics{background:var(--tg-theme-secondary-bg-color);padding:9px;border-radius:10px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row button{flex:1;min-width:0}
button{font-size:13px;padding:8px;border-radius:8px;cursor:pointer}
#exercise{font-weight:600;max-height:38px;overflow:hidden;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--tg-theme-secondary-bg-color)}
th:first-child,td:first-child{text-align:left}#status{min-height:16px;max-height:34px;overflow:hidden}
@media(max-width:250px){body{margin:8px;font-size:13px}h2{font-size:16px}.metrics{padding:6px;margin:6px 0}.row{margin:6px 0;gap:4px}button{font-size:12px;padding:6px}th,td{padding:3px 2px}}
</style></head><body>
<p class="muted">WORKOUT REPORT · READ ONLY</p>
<h2 id="title">Workout report</h2><p id="date" class="muted"></p>
<div class="metrics"><p id="summary"></p><p><strong id="volume">—</strong> <span class="muted">adjusted volume</span></p><p id="coverage" class="muted"></p></div>
<p id="position" class="muted"></p><p id="exercise"></p>
<div class="row"><button id="previous">← Exercise</button><button id="next">Exercise →</button></div>
<button id="toggle">Show sets</button>
<div id="sets" hidden><table><thead><tr><th>Set</th><th>Recorded kg</th><th>Reps</th></tr></thead><tbody id="rows"></tbody></table>
<div class="row"><button id="back">← Sets</button><span id="page" class="muted"></span><button id="more">Sets →</button></div></div>
<p class="muted">Volume is an estimate. — means missing.<br>Recorded loads keep equipment conventions.</p>
<p id="status" class="muted" role="status" aria-live="polite"></p>
<script>
const W=TelegramWidget;
const el=id=>document.getElementById(id);
let state=null,busy=false,expanded=false;
function controls(){
 el('previous').disabled=busy||!state||state.e===0;
 el('next').disabled=busy||!state||state.e+1>=state.ec;
 el('back').disabled=busy||!state||state.p===0;
 el('more').disabled=busy||!state||state.p+1>=state.pc;
 el('toggle').disabled=!state||!state.count;
}
function render(data){
 if(!data||data.v!==1){el('status').textContent='Report unavailable. Send /widget to try again.';return;}
 state=data;
 for(const key of ['title','date','summary','volume','coverage','exercise'])el(key).textContent=data[key];
 el('position').textContent=data.ec?'Exercise '+(data.e+1)+' of '+data.ec:'No exercises';
 el('rows').textContent='';
 data.rows.forEach((row,index)=>{
  const tr=document.createElement('tr');
  [String(data.p*4+index+1),...row].forEach(value=>{const td=document.createElement('td');td.textContent=value;tr.appendChild(td);});
  el('rows').appendChild(tr);
 });
 el('page').textContent=(data.p+1)+' / '+data.pc;
 el('sets').hidden=!expanded||!data.count;
 el('toggle').textContent=expanded?'Hide sets':'Show sets';
 controls();
}
function readState(){try{el('status').textContent='';render(JSON.parse(W.chatData));}catch(e){el('status').textContent='Report unavailable. Send /widget to try again.';}}
function navigate(exercise,page){
 if(busy||!state)return;
 busy=true;controls();el('status').textContent='Loading…';
 try{
  W.request('view:'+exercise+':'+page).then(answer=>{
   const data=JSON.parse(answer.result);
   if(data.error){el('status').textContent=data.error;return;}
   render(data);el('status').textContent='';
  }).catch(()=>{el('status').textContent='Could not load. Tap again to retry.';})
   .finally(()=>{busy=false;controls();});
 }catch(e){busy=false;controls();el('status').textContent='Could not load. Tap again to retry.';}
}
el('previous').addEventListener('click',()=>navigate(state.e-1,0));
el('next').addEventListener('click',()=>navigate(state.e+1,0));
el('back').addEventListener('click',()=>navigate(state.e,state.p-1));
el('more').addEventListener('click',()=>navigate(state.e,state.p+1));
el('toggle').addEventListener('click',()=>{expanded=!expanded;render(state);});
W.onEvent('chatDataChanged',readState);
readState();controls();W.ready();
</script></body></html>
